<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 72" width="280" height="72" aria-label="Griya Joglo Trayang Logo Dark">
  <defs>
    <linearGradient id="gjtDarkMoccasin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF4DE" />
      <stop offset="100%" stop-color="#F2CE94" />
    </linearGradient>
  </defs>

  <!-- Joglo Roof & Pillar Symbol -->
  <g transform="translate(2, 2)">
    <!-- Mustaka Crown -->
    <path d="M28 8 L26 4 L28 1 L30 4 Z" fill="#FFE4B5" />
    <polygon points="23,12 33,12 30,7 26,7" fill="#F2CE94" />
    <!-- Tier 1 -->
    <polygon points="18,21 38,21 33,12 23,12" fill="url(#gjtDarkMoccasin)" />
    <rect x="16" y="21" width="24" height="2.5" rx="1.2" fill="#C8963E" />
    <!-- Tier 2 -->
    <polygon points="10,36 46,36 38,23.5 18,23.5" fill="url(#gjtDarkMoccasin)" />
    <rect x="8" y="36" width="40" height="2.8" rx="1.4" fill="#C8963E" />
    <!-- Tier 3 Broad Main Roof -->
    <polygon points="0,50 56,50 44,38.8 12,38.8" fill="#FFE4B5" />
    <rect x="0" y="50" width="56" height="3" rx="1.5" fill="#F2CE94" />
    <!-- 4 Soko Guru Pillars -->
    <rect x="7" y="53" width="5" height="13" rx="1.2" fill="#FFE4B5" />
    <rect x="20" y="53" width="5" height="13" rx="1.2" fill="#F2CE94" />
    <rect x="31" y="53" width="5" height="13" rx="1.2" fill="#F2CE94" />
    <rect x="44" y="53" width="5" height="13" rx="1.2" fill="#FFE4B5" />
    <!-- Floor Plinth (Umpak) -->
    <rect x="2" y="66" width="52" height="3.5" rx="1.5" fill="#C8963E" />
  </g>

  <!-- Brand Typography -->
  <text x="72" y="27" font-family="'Fraunces', 'Cinzel', Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" fill="#FFE4B5" letter-spacing="0.5">GRIYA JOGLO</text>
  <text x="72" y="47" font-family="'Fraunces', 'Cinzel', Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" fill="#F2CE94" letter-spacing="3">TRAYANG</text>
  <text x="73" y="63" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#FFF4DE" letter-spacing="1.5">MAHAKARYA KAYU JATI JAWA</text>
</svg>
